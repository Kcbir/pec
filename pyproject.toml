[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pec"
version = "1.0.0"
description = "Deciding observational equivalence in non-Markovian decision processes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kabir Murjani" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
baselines = ["aalpy>=1.4"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Kcbir/pec"

[tool.setuptools.packages.find]
include = ["pec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
