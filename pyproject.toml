[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pec"
version = "1.0.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
baselines = ["aalpy>=1.4"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
